<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un sobre para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
    --rosa:#f5a6c8; --rosa-osc:#e98eb5; --rosa-claro:#f8c4dc; --fucsia:#e0518f;
    --fondo1:#ffe3ef; --fondo2:#dfe9ff; --texto:#5a3b4b;
    /* los calcula el script según el tamaño de pantalla */
    --cw:300px; --alto-esc:600px; --hueco:200px; --escala-ini:.5;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
    margin:0; display:flex; overflow-x:hidden;
    font-family:'Nunito',Arial,sans-serif; color:var(--texto);
    background:radial-gradient(circle at 20% 15%,var(--fondo1),transparent 55%),
               radial-gradient(circle at 85% 85%,var(--fondo2),transparent 55%),#fff5fa;
    background-attachment:fixed;
}
.contenedor{margin:auto; text-align:center; padding:10px}
h1{font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:600; font-size:clamp(24px,4.5vw,34px); margin:0 0 4px}
.instruccion{margin:0 0 6px; font-size:15px; opacity:.75; min-height:22px}

/* ---------- Escenario ---------- */
.escenario{position:relative; width:max(300px,var(--cw)); height:var(--alto-esc); margin:auto; cursor:pointer}
.escenario.abierto{cursor:default}

/* El sobre y la tarjeta viajan juntos: al abrir, el sobre baja y la tarjeta sube */
.sobre{
    position:absolute; left:50%; bottom:0; width:300px; height:200px; margin-left:-150px;
    transform:translateY(calc(-1 * var(--hueco)));
    transition:transform 1s cubic-bezier(.3,.9,.3,1) .6s;
}
.abierto .sobre{transform:translateY(0)}

.sobre-atras,.sobre-frente,.tapa{position:absolute; left:0; width:300px}
.sobre-atras{bottom:0; height:200px; background:var(--rosa-osc); border-radius:10px; z-index:1; box-shadow:0 18px 30px rgba(180,80,130,.25)}
.sobre-frente{bottom:0; height:200px; z-index:3; border-radius:10px; background:var(--rosa); clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.tapa{
    bottom:199px; height:115px; z-index:4; background:var(--rosa-claro);
    clip-path:polygon(0 100%,100% 100%,50% 0);
    transform-origin:bottom; transition:transform .7s ease, z-index 0s .35s;
}
.abierto .tapa{transform:rotateX(180deg); z-index:0}
.sello{
    position:absolute; z-index:5; left:50%; bottom:72px; transform:translateX(-50%);
    width:38px; height:38px; border-radius:50%; background:var(--fucsia); color:#fff;
    display:grid; place-items:center; font-size:18px; box-shadow:0 3px 8px rgba(0,0,0,.25); transition:opacity .3s;
}
.abierto .sello{opacity:0}

/* ---------- Tarjeta grande (formato 4:5, como 1080 x 1350) ---------- */
.tarjeta{
    position:absolute; left:50%; bottom:12px; width:var(--cw); margin-left:calc(var(--cw) / -2); z-index:2;
    background:#fff; border-radius:18px; padding:12px 12px 14px;
    box-shadow:0 14px 34px rgba(120,60,90,.3);
    transform-origin:bottom center; transform:scale(var(--escala-ini));
    transition:transform 1s cubic-bezier(.3,.9,.3,1) .6s;
}
.abierto .tarjeta{transform:translateY(-200px) scale(1)}
.tarjeta.fuera{z-index:6}

.foto{position:relative; width:100%; aspect-ratio:4/5; border-radius:12px; overflow:hidden; background:var(--rosa-claro)}
.foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .45s}
.foto img.activa{opacity:1}

.esquina{
    position:absolute; right:12px; bottom:12px; width:50px; height:50px; border:none; border-radius:50%;
    background:var(--fucsia); color:#fff; font-size:30px; line-height:1; padding:0 0 3px 3px; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.3); transition:transform .2s, background .2s; z-index:2;
}
.esquina:hover{transform:scale(1.1); background:#c93f7c}
.esquina:focus-visible{outline:3px solid #fff; outline-offset:2px}

.puntos{display:flex; justify-content:center; gap:7px; margin-top:12px; height:8px}
.punto{width:8px; height:8px; border-radius:50%; background:#f0cddd; transition:background .3s, transform .3s}
.punto.activo{background:var(--fucsia); transform:scale(1.3)}

@media (prefers-reduced-motion:reduce){ .sobre,.tapa,.tarjeta,.foto img{transition-duration:.01s; transition-delay:0s} }
</style>
</head>
<body>
<div class="contenedor">
    <h1>Un sobre para ti</h1>
    <p class="instruccion" id="instruccion">Toca el sobre para abrirlo</p>

    <div class="escenario" id="escenario" role="button" tabindex="0" aria-label="Abrir sobre">
        <div class="sobre">
            <div class="sobre-atras"></div>
            <div class="tarjeta" id="tarjeta">
                <div class="foto" id="foto">
                    <button class="esquina" id="esquina" aria-label="Siguiente imagen">›</button>
                </div>
                <div class="puntos" id="puntos"></div>
            </div>
            <div class="sobre-frente"></div>
            <div class="tapa"></div>
            <div class="sello">♥</div>
        </div>
    </div>
</div>

<script>
/* ============ CONFIGURACIÓN ============
   Pon tus imágenes en la carpeta "imagenes" (junto a este archivo).
   Tamaño recomendado: 1080 x 1350 px (formato 4:5).
   Escribe aquí sus nombres, en el orden en que quieres verlas. */
const IMAGENES = [
    "imagenes/foto1.png",
    "imagenes/foto2.png",
    "imagenes/foto3.png"
];
/* ======================================= */

const escenario = document.getElementById("escenario");
const tarjeta   = document.getElementById("tarjeta");
const foto      = document.getElementById("foto");
const puntos    = document.getElementById("puntos");
const boton     = document.getElementById("esquina");
const instruccion = document.getElementById("instruccion");
let actual = 0;

// Tamaño de la tarjeta: lo más grande que quepa en la pantalla, siempre en 4:5
function medir() {
    const raiz = document.documentElement.style;
    const extra = 12 + 12 + 8 + 14;                         // relleno + puntos
    const porAlto  = (innerHeight - 110 - 212 - extra) / 1.25;
    const porAncho = innerWidth - 20 - 24;
    const imgW = Math.max(200, Math.min(460, porAlto, porAncho));
    const cw = imgW + 24, ch = imgW * 1.25 + extra;
    const alto = 212 + ch;
    raiz.setProperty("--cw", cw + "px");
    raiz.setProperty("--alto-esc", alto + "px");
    raiz.setProperty("--hueco", (alto - 200) / 2 + "px");  // sobre centrado al inicio
    raiz.setProperty("--escala-ini", Math.min(260 / cw, 170 / ch));
}
medir();
addEventListener("resize", medir);

// Crear imágenes y puntos
IMAGENES.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src; img.alt = "Imagen " + (i + 1);
    if (i === 0) img.classList.add("activa");
    foto.insertBefore(img, boton);
    const p = document.createElement("span");
    p.className = "punto" + (i === 0 ? " activo" : "");
    puntos.appendChild(p);
});

function abrir() {
    if (escenario.classList.contains("abierto")) return;
    escenario.classList.add("abierto");
    escenario.removeAttribute("role");
    instruccion.textContent = "Toca la esquina de la imagen para ver la siguiente";
    setTimeout(() => tarjeta.classList.add("fuera"), 1700); // ya salió: pasa al frente
}

function siguiente(e) {
    e.stopPropagation();
    const imgs = foto.querySelectorAll("img"), pts = puntos.children;
    imgs[actual].classList.remove("activa"); pts[actual].classList.remove("activo");
    actual = (actual + 1) % IMAGENES.length;
    imgs[actual].classList.add("activa"); pts[actual].classList.add("activo");
}

escenario.addEventListener("click", abrir);
escenario.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") abrir(); });
boton.addEventListener("click", siguiente);
</script>
</body>
</html>
